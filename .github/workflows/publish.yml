name: Publish to Maven Central

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish'
        required: true
        default: '1.0.0'

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        
      - name: Import GPG key
        env:
          GPG_KEY_BASE64: ${{ secrets.GPG_KEY_BASE64 }}
        run: |
          if [ -z "$GPG_KEY_BASE64" ]; then
            echo "Error: GPG_KEY_BASE64 secret is not set"
            exit 1
          fi
          
          # Decode and import the key into GPG keyring
          echo "$GPG_KEY_BASE64" | base64 -d > $HOME/private-key.asc
          
          # Verify the key was decoded successfully
          if [ ! -s $HOME/private-key.asc ]; then
            echo "Error: Failed to decode GPG key"
            exit 1
          fi
          
          # Import the key
          gpg --batch --import $HOME/private-key.asc
          
          # Export in the old secring.gpg format for Gradle signing plugin
          gpg --batch --pinentry-mode=loopback --passphrase="${{ secrets.SIGNING_PASSWORD }}" \
            --export-secret-keys > $HOME/secring.gpg
          
          # Verify the secring.gpg was created
          if [ ! -s $HOME/secring.gpg ]; then
            echo "Error: Failed to create secring.gpg"
            exit 1
          fi
          
          echo "GPG key imported and exported successfully"
          
          # Clean up the ASCII key file
          rm -f $HOME/private-key.asc
          
      - name: Build and publish
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          ./gradlew publishToMavenLocal \
            -PpublishVersion=${{ github.event.inputs.version || github.ref_name }} \
            -PmavenCentralUsername="$MAVEN_USERNAME" \
            -PmavenCentralPassword="$MAVEN_PASSWORD" \
            -Psigning.keyId="$SIGNING_KEY_ID" \
            -Psigning.password="$SIGNING_PASSWORD" \
            -Psigning.secretKeyRingFile=$HOME/secring.gpg
            
      - name: Create bundle for Maven Central
        run: |
          cd $HOME/.m2/repository/io/github/myapplabs
          zip -r $HOME/toolarge-bundle.zip toolarge-core toolarge-android
          mv $HOME/toolarge-bundle.zip ${{ github.workspace }}/toolarge-bundle.zip
          
      - name: Upload to Maven Central Portal
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          VERSION=${{ github.event.inputs.version || github.ref_name }}
          VERSION=${VERSION#v}  # Remove 'v' prefix if present
          
          echo "Publishing version: $VERSION"
          
          # Create deployment and capture response
          echo "Creating deployment..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer $MAVEN_PASSWORD" \
            -H "Content-Type: application/json" \
            "https://central.sonatype.com/api/v1/publisher/deployment" \
            -d "{\"deploymentName\":\"toolarge-$VERSION\",\"deploymentType\":\"USER_MANAGED\"}")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          RESPONSE_BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $RESPONSE_BODY"
          
          if [ "$HTTP_CODE" != "201" ]; then
            echo "Error: Failed to create deployment"
            exit 1
          fi
          
          DEPLOYMENT_ID=$(echo "$RESPONSE_BODY" | jq -r '.deploymentId')
          echo "Deployment ID: $DEPLOYMENT_ID"
          
          if [ -z "$DEPLOYMENT_ID" ] || [ "$DEPLOYMENT_ID" == "null" ]; then
            echo "Error: Failed to get deployment ID"
            exit 1
          fi
          
          # Upload bundle
          echo "Uploading bundle..."
          UPLOAD_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer $MAVEN_PASSWORD" \
            -F "bundle=@$HOME/toolarge-bundle.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?deploymentId=$DEPLOYMENT_ID&name=toolarge-$VERSION")
          
          UPLOAD_HTTP_CODE=$(echo "$UPLOAD_RESPONSE" | tail -n1)
          echo "Upload HTTP Status: $UPLOAD_HTTP_CODE"
          
          if [ "$UPLOAD_HTTP_CODE" != "201" ] && [ "$UPLOAD_HTTP_CODE" != "200" ]; then
            echo "Error: Failed to upload bundle"
            echo "Response: $(echo "$UPLOAD_RESPONSE" | sed '$d')"
            exit 1
          fi
          
          echo "Bundle uploaded successfully"
          
          # Publish deployment  
          echo "Publishing deployment..."
          PUBLISH_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer $MAVEN_PASSWORD" \
            "https://central.sonatype.com/api/v1/publisher/deployment/$DEPLOYMENT_ID")
          
          PUBLISH_HTTP_CODE=$(echo "$PUBLISH_RESPONSE" | tail -n1)
          echo "Publish HTTP Status: $PUBLISH_HTTP_CODE"
          
          if [ "$PUBLISH_HTTP_CODE" != "201" ] && [ "$PUBLISH_HTTP_CODE" != "200" ]; then
            echo "Error: Failed to publish deployment"
            echo "Response: $(echo "$PUBLISH_RESPONSE" | sed '$d')"
            exit 1
          fi
          
          echo "✅ Successfully published to Maven Central!"
          echo "Note: It may take a few hours for the artifact to appear in Maven Central search"
          
      - name: Upload bundle as artifact
        uses: actions/upload-artifact@v4
        with:
          name: maven-central-bundle
          path: ${{ github.workspace }}/toolarge-bundle.zip
