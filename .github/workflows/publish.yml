name: Publish to Maven Central

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish'
        required: true
        default: '1.0.0'

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        
      - name: Decode GPG key
        env:
          GPG_KEY_BASE64: ${{ secrets.GPG_KEY_BASE64 }}
        run: |
          echo "$GPG_KEY_BASE64" | base64 -d > $HOME/secring.gpg
          
      - name: Build and publish
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          ./gradlew publishToMavenLocal \
            -PpublishVersion=${{ github.event.inputs.version || github.ref_name }} \
            -PmavenCentralUsername="$MAVEN_USERNAME" \
            -PmavenCentralPassword="$MAVEN_PASSWORD" \
            -Psigning.keyId="$SIGNING_KEY_ID" \
            -Psigning.password="$SIGNING_PASSWORD" \
            -Psigning.secretKeyRingFile=$HOME/secring.gpg
            
      - name: Create bundle for Maven Central
        run: |
          cd $HOME/.m2/repository/io/github/myapplabs
          zip -r $HOME/toolarge-bundle.zip toolarge-core toolarge-android
          mv $HOME/toolarge-bundle.zip ${{ github.workspace }}/toolarge-bundle.zip
          
      - name: Upload to Maven Central Portal
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          VERSION=${{ github.event.inputs.version || github.ref_name }}
          VERSION=${VERSION#v}  # Remove 'v' prefix if present
          
          # Create deployment
          DEPLOYMENT_ID=$(curl -s -X POST \
            -H "Authorization: Bearer $(echo -n $MAVEN_USERNAME:$MAVEN_PASSWORD | base64)" \
            -H "Content-Type: application/json" \
            "https://central.sonatype.com/api/v1/publisher/deployment" \
            -d "{\"deploymentName\":\"toolarge-$VERSION\",\"deploymentType\":\"USER_MANAGED\"}" \
            | jq -r '.deploymentId')
          
          echo "Deployment ID: $DEPLOYMENT_ID"
          
          # Upload bundle
          curl -X POST \
            -H "Authorization: Bearer $(echo -n $MAVEN_USERNAME:$MAVEN_PASSWORD | base64)" \
            -F "bundle=@$HOME/toolarge-bundle.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?deploymentId=$DEPLOYMENT_ID&name=toolarge-$VERSION"
            
          # Publish deployment
          curl -X POST \
            -H "Authorization: Bearer $(echo -n $MAVEN_USERNAME:$MAVEN_PASSWORD | base64)" \
            "https://central.sonatype.com/api/v1/publisher/deployment/$DEPLOYMENT_ID"
          
      - name: Upload bundle as artifact
        uses: actions/upload-artifact@v4
        with:
          name: maven-central-bundle
          path: ${{ github.workspace }}/toolarge-bundle.zip
