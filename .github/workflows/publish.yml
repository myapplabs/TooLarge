name: Publish to Maven Central

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish'
        required: true
        default: '1.0.0'

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        
      - name: Import GPG key
        env:
          GPG_KEY_BASE64: ${{ secrets.GPG_KEY_BASE64 }}
        run: |
          if [ -z "$GPG_KEY_BASE64" ]; then
            echo "Error: GPG_KEY_BASE64 secret is not set"
            exit 1
          fi
          
          # Decode and import the key into GPG keyring
          echo "$GPG_KEY_BASE64" | base64 -d > $HOME/private-key.asc
          
          # Verify the key was decoded successfully
          if [ ! -s $HOME/private-key.asc ]; then
            echo "Error: Failed to decode GPG key"
            exit 1
          fi
          
          # Import the key
          gpg --batch --import $HOME/private-key.asc
          
          # Export in the old secring.gpg format for Gradle signing plugin
          gpg --batch --pinentry-mode=loopback --passphrase="${{ secrets.SIGNING_PASSWORD }}" \
            --export-secret-keys > $HOME/secring.gpg
          
          # Verify the secring.gpg was created
          if [ ! -s $HOME/secring.gpg ]; then
            echo "Error: Failed to create secring.gpg"
            exit 1
          fi
          
          echo "GPG key imported and exported successfully"
          
          # Clean up the ASCII key file
          rm -f $HOME/private-key.asc
          
      - name: Build and sign artifacts locally
        env:
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          VERSION=${{ github.event.inputs.version || github.ref_name }}
          VERSION=${VERSION#v}  # Remove 'v' prefix if present
          
          echo "Building and signing version: $VERSION"
          
          ./gradlew publishToMavenLocal \
            -PpublishVersion="$VERSION" \
            -Psigning.keyId="$SIGNING_KEY_ID" \
            -Psigning.password="$SIGNING_PASSWORD" \
            -Psigning.secretKeyRingFile=$HOME/secring.gpg \
            --no-daemon
          
          echo "✅ Artifacts built and signed successfully"
          
      - name: Create bundle for Maven Central Portal
        run: |
          VERSION=${{ github.event.inputs.version || github.ref_name }}
          VERSION=${VERSION#v}
          
          cd $HOME/.m2/repository/io/github/myapplabs
          zip -r $HOME/toolarge-bundle.zip toolarge-core toolarge-android
          
          echo "📦 Bundle created: $HOME/toolarge-bundle.zip"
          ls -lh $HOME/toolarge-bundle.zip
          
      - name: Upload bundle as artifact
        uses: actions/upload-artifact@v4
        with:
          name: toolarge-maven-bundle-${{ github.event.inputs.version || github.ref_name }}
          path: ~/toolarge-bundle.zip
          
      - name: Display next steps
        run: |
          VERSION=${{ github.event.inputs.version || github.ref_name }}
          VERSION=${VERSION#v}
          
          echo "✅ Build complete! Bundle is ready for Maven Central."
          echo ""
          echo "📦 Download the bundle artifact from this workflow run"
          echo ""
          echo "🚀 To publish to Maven Central:"
          echo "  1. Go to: https://central.sonatype.com/publishing"
          echo "  2. Click 'Publish Component'"
          echo "  3. Upload the toolarge-bundle.zip file"
          echo "  4. Click 'Publish'"
          echo ""
          echo "🕐 After publishing, it takes 10-30 minutes to sync"
          echo "🔍 Check at: https://search.maven.org/search?q=g:io.github.myapplabs"
