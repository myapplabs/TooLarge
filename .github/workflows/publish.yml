name: Publish to Maven Central

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish'
        required: true
        default: '1.0.0'

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        
      - name: Import GPG key
        env:
          GPG_KEY_BASE64: ${{ secrets.GPG_KEY_BASE64 }}
        run: |
          if [ -z "$GPG_KEY_BASE64" ]; then
            echo "Error: GPG_KEY_BASE64 secret is not set"
            exit 1
          fi
          
          # Decode and import the key into GPG keyring
          echo "$GPG_KEY_BASE64" | base64 -d > $HOME/private-key.asc
          
          # Verify the key was decoded successfully
          if [ ! -s $HOME/private-key.asc ]; then
            echo "Error: Failed to decode GPG key"
            exit 1
          fi
          
          # Import the key
          gpg --batch --import $HOME/private-key.asc
          
          # Export in the old secring.gpg format for Gradle signing plugin
          gpg --batch --pinentry-mode=loopback --passphrase="${{ secrets.SIGNING_PASSWORD }}" \
            --export-secret-keys > $HOME/secring.gpg
          
          # Verify the secring.gpg was created
          if [ ! -s $HOME/secring.gpg ]; then
            echo "Error: Failed to create secring.gpg"
            exit 1
          fi
          
          echo "GPG key imported and exported successfully"
          
          # Clean up the ASCII key file
          rm -f $HOME/private-key.asc
          
      - name: Publish to Maven Central
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          VERSION=${{ github.event.inputs.version || github.ref_name }}
          VERSION=${VERSION#v}  # Remove 'v' prefix if present
          
          echo "Publishing version: $VERSION to Maven Central"
          
          ./gradlew publishAllPublicationsToCentralRepository \
            -PpublishVersion="$VERSION" \
            -PmavenCentralUsername="$MAVEN_USERNAME" \
            -PmavenCentralPassword="$MAVEN_PASSWORD" \
            -Psigning.keyId="$SIGNING_KEY_ID" \
            -Psigning.password="$SIGNING_PASSWORD" \
            -Psigning.secretKeyRingFile=$HOME/secring.gpg \
            --no-daemon \
            --stacktrace
          
          echo "✅ Successfully published to Maven Central staging repository!"
          echo "📦 Artifacts have been uploaded to the staging repository"
          echo ""
          echo "⏳ Next steps:"
          echo "  1. Log in to https://s01.oss.sonatype.org/"
          echo "  2. Go to 'Staging Repositories'"
          echo "  3. Find your repository (io.github.myapplabs)"
          echo "  4. Click 'Close' to validate the artifacts"
          echo "  5. Once validation passes, click 'Release' to publish"
          echo ""
          echo "🕐 After release, it takes 10-30 minutes to sync to Maven Central"
          echo "🔍 Check status at: https://search.maven.org/search?q=g:io.github.myapplabs"
